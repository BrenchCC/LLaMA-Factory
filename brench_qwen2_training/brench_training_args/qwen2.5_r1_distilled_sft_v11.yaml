### model
model_name_or_path: brench_qwen2_training/base_models_ckpt/Qwen2.5-1.5B-Instruct
trust_remote_code: true

### method
stage: sft
do_train: true
finetuning_type: full
deepspeed: brench_qwen2_training/brench_training_args/deepspeed_args/ds_z3_config.json  

### dataset
dataset: OpenR1-Math-93K,MetaMathQA-R1-Distill-395K
dataset_dir: brench_qwen2_training/brench_training_data
template: qwen
overwrite_cache: false
preprocessing_num_workers: 64

### output
output_dir: brench_qwen2_training/brench_training_saves/qwen2-1.5b-r1-distill-v11/full/sft
logging_steps: 1
save_steps: 1000
# save_total_limit: 5
plot_loss: true
overwrite_output_dir: false

### train
per_device_train_batch_size: 4
gradient_accumulation_steps: 4
flash_attn: fa2
learning_rate: 1.0e-5
num_train_epochs: 3.0
lr_scheduler_type: cosine
warmup_ratio: 0.1
bf16: true
ddp_timeout: 180000000
report_to: wandb
run_name: qwen2-1.5b-r1-distill-v11
